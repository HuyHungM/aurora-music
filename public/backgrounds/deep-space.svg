<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep Space">
  <!-- Deep Space. The darkest preset, and the only one that is genuinely close
       to black: a single faint indigo core with scattered dim stars, so the
       image reads as depth rather than as a colour. For anyone who wants the
       aurora to be atmosphere and not wallpaper. -->
  <defs>
    <radialGradient id="base" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#0b0a18" />
      <stop offset="0.5" stop-color="#07060f" />
      <stop offset="1" stop-color="#030308" />
    </radialGradient>
    <radialGradient id="core" cx="0.62" cy="0.38" r="0.42">
      <stop offset="0" stop-color="#4a3a9e" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#2e2470" stop-opacity="0.13" />
      <stop offset="1" stop-color="#2e2470" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)" />
  <rect width="1600" height="1000" fill="url(#core)" />
  <g fill="#cfd4ff">
    <circle cx="180" cy="140" r="1.6" opacity="0.5" />
    <circle cx="412" cy="286" r="1.1" opacity="0.34" />
    <circle cx="655" cy="122" r="1.4" opacity="0.42" />
    <circle cx="902" cy="332" r="1" opacity="0.3" />
    <circle cx="1140" cy="176" r="1.7" opacity="0.46" />
    <circle cx="1368" cy="296" r="1.2" opacity="0.34" />
    <circle cx="1520" cy="128" r="1" opacity="0.28" />
    <circle cx="268" cy="452" r="1.3" opacity="0.32" />
    <circle cx="760" cy="470" r="1.5" opacity="0.38" />
    <circle cx="1010" cy="590" r="1.1" opacity="0.3" />
    <circle cx="1290" cy="512" r="1.4" opacity="0.36" />
    <circle cx="340" cy="680" r="1.2" opacity="0.3" />
    <circle cx="880" cy="742" r="1.6" opacity="0.4" />
    <circle cx="1420" cy="700" r="1.1" opacity="0.3" />
    <circle cx="620" cy="880" r="1.3" opacity="0.34" />
    <circle cx="1180" cy="906" r="1.5" opacity="0.36" />
  </g>
</svg>
