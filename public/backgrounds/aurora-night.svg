<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurora Night">
  <!-- Aurora Night. A violet-to-indigo curtain over a near-black violet base,
       with one cyan band low and left so the composition is not symmetrical.
       Hand-authored: every stop below is a deliberate colour decision, which is
       the only reason "no third-party artwork" is verifiable in a diff. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a0813" />
      <stop offset="0.55" stop-color="#0d0a1c" />
      <stop offset="1" stop-color="#07060f" />
    </linearGradient>
    <radialGradient id="curtainA" cx="0.28" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#5b3fb8" stop-opacity="0.55" />
      <stop offset="0.45" stop-color="#3d2a86" stop-opacity="0.26" />
      <stop offset="1" stop-color="#3d2a86" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="curtainB" cx="0.82" cy="0.86" r="0.7">
      <stop offset="0" stop-color="#2b6fb5" stop-opacity="0.4" />
      <stop offset="0.5" stop-color="#234f88" stop-opacity="0.18" />
      <stop offset="1" stop-color="#234f88" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="band" x1="0.05" y1="1" x2="0.6" y2="0.2">
      <stop offset="0" stop-color="#3fb0c9" stop-opacity="0.3" />
      <stop offset="0.6" stop-color="#3fb0c9" stop-opacity="0.06" />
      <stop offset="1" stop-color="#3fb0c9" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07060f" stop-opacity="0.1" />
      <stop offset="1" stop-color="#07060f" stop-opacity="0.62" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)" />
  <rect width="1600" height="1000" fill="url(#curtainA)" />
  <rect width="1600" height="1000" fill="url(#curtainB)" />
  <rect width="1600" height="1000" fill="url(#band)" />
  <rect width="1600" height="1000" fill="url(#veil)" />
</svg>
